name: Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: [self-hosted, Windows, X64, trail-radio]
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Test phone permission flow
        run: node tests/permission-flow.test.cjs
      - name: Test update URL policy
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/trail-policy-tests" | Out-Null
          & "$env:JAVA_HOME/bin/javac.exe" -d "$env:RUNNER_TEMP/trail-policy-tests" android/app/src/main/java/com/trailradio/app/UpdatePolicy.java android/tests/UpdatePolicyTest.java
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile update tests.' }
          & "$env:JAVA_HOME/bin/java.exe" -cp "$env:RUNNER_TEMP/trail-policy-tests" com.trailradio.app.UpdatePolicyTest
          if ($LASTEXITCODE -ne 0) { throw 'Update policy tests failed.' }
      - name: Build signed APK
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TRAIL_VERSION_NAME = '${{ github.ref_name }}' -replace '^v',''
          $env:TRAIL_VERSION_CODE = '${{ github.run_number }}'
          if (-not $env:TRAIL_KEYSTORE -or -not (Test-Path -LiteralPath $env:TRAIL_KEYSTORE)) { throw 'Big Walk Radio signing key is missing from this runner.' }
          Push-Location android
          try { ./gradlew.bat --no-daemon assembleRelease; if ($LASTEXITCODE -ne 0) { throw "Gradle failed: $LASTEXITCODE" } }
          finally { Pop-Location }
          Copy-Item android/app/build/outputs/apk/release/app-release.apk Trail-Radio.apk
          Copy-Item Trail-Radio.apk Big-Walk-Radio.apk
          $hash = (Get-FileHash Trail-Radio.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$hash  Big-Walk-Radio.apk", "$hash  Trail-Radio.apk") | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TAG --repo $env:REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG Big-Walk-Radio.apk Trail-Radio.apk SHA256SUMS.txt --repo $env:REPOSITORY --clobber
          } else {
            gh release create $env:TAG Big-Walk-Radio.apk Trail-Radio.apk SHA256SUMS.txt --repo $env:REPOSITORY --title "Big Walk Radio $env:TAG" --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release assets.' }
