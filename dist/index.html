<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8b95f"><title>Big Walk Radio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js" defer></script><script src="app.js" defer></script></head>
<body><main class="device"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>BIG WALK<br>RADIO</span></div><button id="check-update" class="update-link" type="button" hidden>UPDATES ↗</button></header>
<section class="radio-display" aria-label="Radio status"><div class="display-heading"><span><span class="status-dot"></span> <span id="screen-label">OFFLINE</span></span><span>▮ ▮ ▮</span></div><div id="screen-main">READY?</div><div id="screen-sub">START OR JOIN A GROUP</div><div class="display-wave" aria-hidden="true">▂ ▃ ▂ ▄ ▂ ▆ ▃ ▄ ▂ ▅ ▂ ▃ ▂ ▄ ▂</div></section>
<div id="message" class="message" role="status" aria-live="polite"></div><button id="permission-settings" class="settings-link" type="button" hidden>OPEN APP SETTINGS ↗</button>
<section id="setup" class="setup-card" aria-label="Group setup"><div class="setup-title"><div><span class="eyebrow">YOUR GROUP</span><h1>Find your people.</h1></div><svg class="small-key" viewBox="0 0 64 100" aria-hidden="true"><circle cx="32" cy="25" r="19" fill="#eac273" stroke="#40594b" stroke-width="5"/><circle cx="32" cy="25" r="7" fill="#f7f4df" stroke="#40594b" stroke-width="4"/><path d="M25 44h14v30h10v10H39v9H25z" fill="#eac273" stroke="#40594b" stroke-width="5" stroke-linejoin="round"/></svg></div><div class="tabs" role="tablist"><button id="host-tab" class="active" role="tab" aria-selected="true" type="button">HOST A GROUP</button><button id="join-tab" role="tab" aria-selected="false" type="button">JOIN A GROUP</button></div><form id="setup-form"><label for="name">YOUR NAME</label><input id="name" maxlength="24" placeholder="Your name" required autocomplete="nickname"><div id="room-name-wrap"><label for="room-name">GROUP NAME</label><input id="room-name" maxlength="32" placeholder="e.g. The Wanderers"></div><div id="code-wrap" hidden><label for="code">GROUP CODE</label><input id="code" placeholder="Paste the group code" autocomplete="off" autocapitalize="none" spellcheck="false"></div><button class="primary" id="start" type="submit">START A GROUP <span aria-hidden="true">↗</span></button></form><p class="permission-note">Microphone and location access are needed to use your radio.</p></section>
<section id="connected" class="group-card" aria-label="Your group" hidden><div class="group-line"><div class="group-info"><span class="eyebrow">YOUR GROUP</span><h2 id="group-title">Your group</h2></div><button id="leave" class="text-button" type="button">LEAVE</button></div><div class="invite-line"><div class="code-info"><span class="eyebrow">INVITE CODE</span><strong id="room-code">—</strong></div><button id="copy" class="share-button" type="button">SHARE ↗</button></div><span id="connection-status" hidden>ON THE AIR</span></section>
<button id="talk" class="talk-button" disabled aria-label="Hold to talk" type="button"><span class="talk-spark" aria-hidden="true">✳</span><strong>HOLD TO TALK</strong><small>RELEASE TO LISTEN</small></button>
<details class="crew-card" id="crew-details" hidden><summary><span>THE CREW <span id="count">01</span></span><span class="range-tag">◉ 1,500 FT RANGE</span></summary><div id="roster" class="roster"></div></details>
<div class="device-bottom" aria-hidden="true"><span>●</span><svg viewBox="0 0 72 88" class="small-gourd"><path d="M36 15c-1-5 1-9 5-11" fill="none" stroke="#40594b" stroke-width="5" stroke-linecap="round"/><path d="M36 17c16-5 23 5 20 15-2 6 0 9 6 15 10 10 8 27-2 33-13 8-35 8-47 0C3 73 2 57 12 47c6-6 8-10 6-15-3-11 5-20 18-15z" fill="#d97762" stroke="#40594b" stroke-width="4"/></svg><span>●</span></div></main></body></html>
